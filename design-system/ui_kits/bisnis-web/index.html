<!-- @dsCard group="Amar Bank Bisnis Web" viewport="1440x900" name="Bisnis web dashboard" subtitle="Interactive kit: login → dashboard → transfer → transactions → notifications" -->
<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Amar Bank Bisnis — Web UI Kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Login.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="Transfer.jsx"></script>
<script type="text/babel" src="Transactions.jsx"></script>
<script type="text/babel">
const TITLES = { home: null, transfer: ['Transfer', 'Kirim dana ke rekening Amar Bank atau bank lain.'], history: ['Riwayat Transaksi', 'Semua transaksi rekening perusahaan.'], notifications: ['Notifikasi', 'Atur pemberitahuan dan lihat kotak masuk.'] };
function App() {
  const [authed, setAuthed] = React.useState(() => localStorage.getItem('abkit-authed') !== '0');
  const [page, setPageRaw] = React.useState(() => localStorage.getItem('abkit-page') || 'home');
  const [preset, setPreset] = React.useState(null);
  const [txn, setTxn] = React.useState(null);
  const { Avatar, Toast } = window.AmarBankInternalWebDS_806d63;
  const [toast, setToast] = React.useState(null);
  const setPage = (p, data) => { const known = ['home', 'transfer', 'history', 'notifications']; if (!known.includes(p)) { setToast(p); setTimeout(() => setToast(null), 2600); return; } setPreset(data || null); setPageRaw(p); localStorage.setItem('abkit-page', p); };
  if (!authed) return <Login onLogin={() => { setAuthed(true); localStorage.setItem('abkit-authed', '1'); }} />;
  const t = TITLES[page];
  return (
    <>
      <Shell page={page} setPage={setPage} onLogout={() => { setAuthed(false); localStorage.setItem('abkit-authed', '0'); }}
        media={!t ? <Avatar size={48} src={AV + 'arthur-taylor.png'} status="online" badge="verified" /> : null}
        title={t ? t[0] : 'Arthur Taylor'} description={t ? t[1] : 'Selamat datang kembali di Amar Bank Bisnis.'}>
        {page === 'home' && <Dashboard go={setPage} openTxn={setTxn} />}
        {page === 'transfer' && <Transfer key={JSON.stringify(preset)} preset={preset} done={() => setPage('home')} />}
        {page === 'history' && <Transactions openTxn={setTxn} />}
        {page === 'notifications' && <Notifications />}
      </Shell>
      <TxnDrawer t={txn} onClose={() => setTxn(null)} />
      {toast && <div style={{ position: 'fixed', right: 24, bottom: 24, zIndex: 200 }}><Toast status="information" title="Belum tersedia di UI kit" onDismiss={() => setToast(null)}>Halaman ini tidak termasuk dalam recreation.</Toast></div>}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
