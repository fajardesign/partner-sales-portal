<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-strong-950);background:var(--bg-white-0)}.g{display:grid;gap:8px}.sw{height:56px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}.n{font:var(--label-xs);margin-top:6px}.v{font:var(--paragraph-xs);color:var(--text-sub-600)}.r{display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid var(--stroke-soft-200)}.r:last-child{border:0}.m{font:var(--paragraph-xs);color:var(--text-soft-400);width:150px;flex-shrink:0}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div><div class="sw" style="background:var(--gold-500)"></div><div class="n">500</div></div><div><div class="sw" style="background:var(--gold-600)"></div><div class="n">600</div></div><div><div class="sw" style="background:var(--gold-700)"></div><div class="n">700</div></div><div><div class="sw" style="background:var(--gold-800)"></div><div class="n">800</div></div><div><div class="sw" style="background:var(--gold-900)"></div><div class="n">900</div></div></div><div style="height:16px"></div><div class="g" style="grid-template-columns:repeat(11,1fr)"><div><div class="sw" style="background:var(--green-50)"></div><div class="n">50</div></div><div><div class="sw" style="background:var(--green-100)"></div><div class="n">100</div></div><div><div class="sw" style="background:var(--green-200)"></div><div class="n">200</div></div><div><div class="sw" style="background:var(--green-300)"></div><div class="n">300</div></div><div><div class="sw" style="background:var(--green-400)"></div><div class="n">400</div></div><div><div class="sw" style="background:var(--green-500)"></div><div class="n">500</div></div><div><div class="sw" style="background:var(--green-600)"></div><div class="n">600</div></div><div><div class="sw" style="background:var(--green-700)"></div><div class="n">700</div></div><div><div class="sw" style="background:var(--green-800)"></div><div class="n">800</div></div><div><div class="sw" style="background:var(--green-900)"></div><div class="n">900</div></div><div><div class="sw" style="background:var(--green-950)"></div><div class="n">950</div></div></div></body></html>
