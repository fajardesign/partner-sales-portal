<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-strong-950);background:var(--bg-white-0)}.g{display:grid;gap:8px}.sw{height:56px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}.n{font:var(--label-xs);margin-top:6px}.v{font:var(--paragraph-xs);color:var(--text-sub-600)}.r{display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid var(--stroke-soft-200)}.r:last-child{border:0}.m{font:var(--paragraph-xs);color:var(--text-soft-400);width:150px;flex-shrink:0}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr);gap:10px"><div style="border-radius:10px;overflow:hidden;box-shadow:var(--shadow-stroke)"><div style="height:36px;background:var(--state-success-base)"></div><div style="display:flex"><div style="flex:1;height:20px;background:var(--state-success-light)"></div><div style="flex:1;height:20px;background:var(--state-success-lighter)"></div></div><div style="padding:6px 8px" class="n">success</div></div><div style="border-radius:10px;overflow:hidden;box-shadow:var(--shadow-stroke)"><div style="height:36px;background:var(--state-error-base)"></div><div style="display:flex"><div style="flex:1;height:20px;background:var(--state-error-light)"></div><div style="flex:1;height:20px;background:var(--state-error-lighter)"></div></div><div style="padding:6px 8px" class="n">error</div></div><div style="border-radius:10px;overflow:hidden;box-shadow:var(--shadow-stroke)"><div style="height:36px;background:var(--state-warning-base)"></div><div style="display:flex"><div style="flex:1;height:20px;background:var(--state-warning-light)"></div><div style="flex:1;height:20px;background:var(--state-warning-lighter)"></div></div><div style="padding:6px 8px" class="n">warning</div></div><div style="border-radius:10px;overflow:hidden;box-shadow:var(--shadow-stroke)"><div style="height:36px;background:var(--state-information-base)"></div><div style="display:flex"><div style="flex:1;height:20px;background:var(--state-information-light)"></div><div style="flex:1;height:20px;background:var(--state-information-lighter)"></div></div><div style="padding:6px 8px" class="n">information</div></div><div style="border-radius:10px;overflow:hidden;box-shadow:var(--shadow-stroke)"><div style="height:36px;background:var(--state-away-base)"></div><div style="display:flex"><div style="flex:1;height:20px;background:var(--state-away-light)"></div><div style="flex:1;height:20px;background:var(--state-away-lighter)"></div></div><div style="padding:6px 8px" class="n">away</div></div><div style="border-radius:10px;overflow:hidden;box-shadow:var(--shadow-stroke)"><div style="height:36px;background:var(--state-feature-base)"></div><div style="display:flex"><div style="flex:1;height:20px;background:var(--state-feature-light)"></div><div style="flex:1;height:20px;background:var(--state-feature-lighter)"></div></div><div style="padding:6px 8px" class="n">feature</div></div><div style="border-radius:10px;overflow:hidden;box-shadow:var(--shadow-stroke)"><div style="height:36px;background:var(--state-highlighted-base)"></div><div style="display:flex"><div style="flex:1;height:20px;background:var(--state-highlighted-light)"></div><div style="flex:1;height:20px;background:var(--state-highlighted-lighter)"></div></div><div style="padding:6px 8px" class="n">highlighted</div></div><div style="border-radius:10px;overflow:hidden;box-shadow:var(--shadow-stroke)"><div style="height:36px;background:var(--state-stable-base)"></div><div style="display:flex"><div style="flex:1;height:20px;background:var(--state-stable-light)"></div><div style="flex:1;height:20px;background:var(--state-stable-lighter)"></div></div><div style="padding:6px 8px" class="n">stable</div></div><div style="border-radius:10px;overflow:hidden;box-shadow:var(--shadow-stroke)"><div style="height:36px;background:var(--state-verified-base)"></div><div style="display:flex"><div style="flex:1;height:20px;background:var(--state-verified-light)"></div><div style="flex:1;height:20px;background:var(--state-verified-lighter)"></div></div><div style="padding:6px 8px" class="n">verified</div></div><div style="border-radius:10px;overflow:hidden;box-shadow:var(--shadow-stroke)"><div style="height:36px;background:var(--state-faded-base)"></div><div style="display:flex"><div style="flex:1;height:20px;background:var(--state-faded-light)"></div><div style="flex:1;height:20px;background:var(--state-faded-lighter)"></div></div><div style="padding:6px 8px" class="n">faded</div></div></div></body></html>
