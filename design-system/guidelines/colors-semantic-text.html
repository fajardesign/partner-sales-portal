<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-strong-950);background:var(--bg-white-0)}.g{display:grid;gap:8px}.sw{height:56px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}.n{font:var(--label-xs);margin-top:6px}.v{font:var(--paragraph-xs);color:var(--text-sub-600)}.r{display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid var(--stroke-soft-200)}.r:last-child{border:0}.m{font:var(--paragraph-xs);color:var(--text-soft-400);width:150px;flex-shrink:0}</style></head><body><div class="g" style="grid-template-columns:repeat(6,1fr)"><div><div class="sw" style="background:var(--text-strong-950)"></div><div class="n">text strong</div><div class="v">--text-strong-950</div></div><div><div class="sw" style="background:var(--text-sub-600)"></div><div class="n">text sub</div><div class="v">--text-sub-600</div></div><div><div class="sw" style="background:var(--text-soft-400)"></div><div class="n">text soft</div><div class="v">--text-soft-400</div></div><div><div class="sw" style="background:var(--text-disabled-300)"></div><div class="n">disabled</div><div class="v">--text-disabled-300</div></div><div><div class="sw" style="background:var(--stroke-sub-300)"></div><div class="n">stroke sub</div><div class="v">--stroke-sub-300</div></div><div><div class="sw" style="background:var(--stroke-soft-200)"></div><div class="n">stroke soft</div><div class="v">--stroke-soft-200</div></div></div></body></html>
